<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patchwork — Stitched components</title><link rel="stylesheet" href="patch-components.css?revision=5"><style>@font-face{font-family:Fraunces;src:url(fonts/Fraunces-1.ttf);font-weight:700}@font-face{font-family:"Public Sans";src:url(fonts/Public-Sans-0.ttf)}body{margin:0;background:var(--patchwork-paper);color:var(--patchwork-ink);font:18px/1.5 "Public Sans",sans-serif}main{max-width:1080px;margin:auto;padding:48px 28px}h1{font:700 clamp(40px,6vw,72px)/1.12 Fraunces,serif;margin:18px 0}header{display:flex;align-items:center;gap:24px}header img{width:140px;height:140px}.buttons{display:flex;gap:28px;flex-wrap:wrap;margin:42px 0}.sample{width:100%;height:auto;margin:24px 0}a{color:var(--patchwork-green)}</style><script src="patch-stitches.js?revision=1" defer></script></head><body><main><header><img src="logos/mark-primary.svg" alt="Patchwork P in a tomato stitched patch"><div><h1>A little help,<br>from a friend.</h1><p>Soft green ink on warm paper, and one stitched patch shape for the mark, the buttons and their shadows.</p></div></header><div class="buttons"><button class="patchwork-button" type="button">Help a neighbour</button><button class="patchwork-button patchwork-button--tomato" type="button">Pass it on</button></div><div class="sewing-details" aria-hidden="true"><img src="decorative/buttons.svg" alt=""><img src="decorative/needle-thread.svg" alt=""><img src="decorative/spool.svg" alt=""></div><p>These are component examples, not a working page. Each button face and its offset shadow have the same asymmetric corners.</p><img class="sample" src="social/banner-x-bluesky.png" alt="Patchwork banner on warm paper: the headline “A little help, from a friend.” in green serif type, with four stitched patches"><p><a href="GUIDE.md">Brand guide</a> · <a href="patch-components.css?revision=5">Reusable button CSS</a></p></main></body></html>
