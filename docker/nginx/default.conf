server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404/index.html;
    location = /404/index.html {
        internal;
        add_header X-Robots-Tag "noindex" always;
    }

    # Only API-backed and authenticated routes need the application shell.
    location ~ ^/admin(/|$) {
        try_files $uri /index.html;
        add_header X-Robots-Tag "noindex" always;
    }
    location ~ ^/development(/|$) {
        try_files $uri /index.html;
    }

    location = /projects { return 301 /products; }
    location = /products/transcript-create { return 301 /products/rekolekt; }
    location = /projects/transcript-create { return 301 /products/rekolekt; }
    location = /projects/omarchy-plugin-spool { return 301 /products/spool; }
    location = /projects/omarchy-plugin-shelfish { return 301 /products/shelfish; }
    location = /projects/obsidian-plugin-metronome-tuner { return 301 /products/metronome-tuner; }
    location ~ ^/projects/([^/]+)/?$ { return 301 /products/$1; }

    # Public routes have their complete content and metadata in static HTML.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Long-lived cache for hashed assets (Vite puts them in /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
