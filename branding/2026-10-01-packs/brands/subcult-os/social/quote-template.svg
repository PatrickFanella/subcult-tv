<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img"><title>quote-template</title><rect x="0" y="0" width="1080" height="1080" rx="0" fill="#09090b"/><text x="48" y="64" font-family="JetBrains Mono" font-size="19" font-weight="400" fill="#fbbf24">PLAN / COORDINATE / RUN DOOR / SETTLE / ARCHIVE</text><text x="48" y="228" font-family="Georgia" font-size="150" font-weight="700" fill="#fbbf24">“</text><text x="48" y="347" font-family="Georgia" font-size="67" font-weight="700" fill="#fafafa">Add the exact quote.</text><text x="48" y="444" font-family="Georgia" font-size="67" font-weight="700" fill="#fafafa">Keep its context.</text><path d="M48 655 L1032 655" stroke="#fbbf24" stroke-width="5" fill="none"/><text x="48" y="725" font-family="JetBrains Mono" font-size="24" font-weight="400" fill="#fafafa">SOURCE / SPEAKER / DATE</text><text x="48" y="781" font-family="JetBrains Mono" font-size="22" font-weight="400" fill="#fafafa">ORIGINAL URL / TIMESTAMP</text><path d="M48 994 L1032 994" stroke="#fbbf24" stroke-width="2" fill="none"/><text x="48" y="1037" font-family="JetBrains Mono" font-size="20" font-weight="400" fill="#fafafa">rekolekt / by SUBCULT</text></svg>