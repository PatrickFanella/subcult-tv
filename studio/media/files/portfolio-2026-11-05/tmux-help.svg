<text xml:space="preserve" x="64" y="303" fill="#d5e3eb" font-family="JetBrains Mono" font-size="18" font-weight="400">Prefix + C-h     popup help         help           deps:tmux                   ok</text>
<text xml:space="preserve" x="64" y="326" fill="#d5e3eb" font-family="JetBrains Mono" font-size="18" font-weight="400">Prefix + T       shell              shell          deps:shell                  ok</text>
