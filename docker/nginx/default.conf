server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prerendered routes have their own index.html with route metadata
    # (scripts/prerender-meta.ts). Serve it without the trailing-slash
    # redirect that `$uri/` would cause; everything else gets the SPA shell.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Long-lived cache for hashed assets (Vite puts them in /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
