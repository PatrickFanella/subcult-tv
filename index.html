<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SUBCULT builds open-source tools for underground scenes, mutual aid, archives, and independent media."
    />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SUBCULT" />
    <meta property="og:title" content="SUBCULT | Open-source tools for independent culture" />
    <meta
      property="og:description"
      content="Open-source tools for underground scenes, mutual aid, archives, and independent media. Inspect the public project catalog."
    />
    <meta property="og:url" content="https://subcult.tv" />
    <meta property="og:image" content="https://subcult.tv/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@subcult_tv" />
    <meta name="twitter:title" content="SUBCULT | Open-source tools for independent culture" />
    <meta
      name="twitter:description"
      content="Open-source tools for underground scenes, mutual aid, archives, and independent media. Inspect the public project catalog."
    />
    <meta name="twitter:image" content="https://subcult.tv/og-image.png" />

    <title>SUBCULT | Open-source tools for independent culture</title>

    <!-- RSS Feed -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="SUBCULT Zine RSS Feed"
      href="/feed.xml"
    />

    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Umami analytics (self-hosted, privacy-first). Injected only when configured:
        copy .env.example → .env and set VITE_UMAMI_URL + VITE_UMAMI_WEBSITE_ID. -->
    <script>
      (function () {
        var u = '%VITE_UMAMI_URL%';
        var id = '%VITE_UMAMI_WEBSITE_ID%';
        if (!id || id.indexOf('VITE_UMAMI_WEBSITE_ID') !== -1) return;
        if (u.indexOf('VITE_UMAMI_URL') !== -1) u = '';
        var s = document.createElement('script');
        s.defer = true;
        s.src = u + '/script.js';
        s.setAttribute('data-website-id', id);
        if (u) s.setAttribute('data-host-url', u);
        document.head.appendChild(s);
      })();
    </script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
