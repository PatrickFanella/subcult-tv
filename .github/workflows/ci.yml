name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════
  # Frontend Checks
  # ═══════════════════════════════════════════════════════════
  frontend:
    name: Frontend
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The runner image's git-lfs 3.7.1 sends both the checkout header and the
      # header Gitea returns per object; Cloudflare answers the duplicate with
      # 400. A credential helper sends one.
      - name: Fetch LFS objects
        env:
          LFS_TOKEN: ${{ github.token }}
        run: |
          git lfs install --local
          # The helper reads LFS_TOKEN when Git invokes it.
          # shellcheck disable=SC2016
          git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo "password=${LFS_TOKEN}"; }; f' lfs pull --include="public/**"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Catalog check
        run: npm run check:catalog

      - name: Build
        run: npm run build

  # ═══════════════════════════════════════════════════════════
  # Backend Checks
  # ═══════════════════════════════════════════════════════════
  backend:
    name: Backend
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-local-review
          POSTGRES_DB: subcult_test
        options: >-
          --label subcult.tv.ci-database=${{ github.run_id }}-${{ github.run_attempt }}
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false


      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: api/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Locate the job database
        env:
          TEST_DATABASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # The runner puts jobs on Docker's shared bridge network: localhost is
          # the job container and there is no service hostname. Use only this
          # run's labeled service container.
          [[ "$TEST_DATABASE_RUN" =~ ^[0-9]+-[0-9]+$ ]]
          test_db_id=$(docker ps --no-trunc --quiet --filter "label=subcult.tv.ci-database=$TEST_DATABASE_RUN")
          if ! [[ "$test_db_id" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Expected exactly one database container for this run' >&2
            exit 1
          fi
          test_db_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$test_db_id")
          if ! [[ "$test_db_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo 'Expected exactly one IPv4 address for the job database' >&2
            exit 1
          fi
          echo "TEST_DATABASE_URL=postgres://postgres:ci-local-review@$test_db_ip:5432/subcult_test?sslmode=disable" >> "$GITHUB_ENV"

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build -o server ./cmd/server

  # ═══════════════════════════════════════════════════════════
  # Docker Build Check
  # ═══════════════════════════════════════════════════════════
  docker:
    name: Docker Build
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false


      - name: Build API image
        run: docker build -t subcult-api ./api

  studio:
    name: Studio Sources
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch Studio LFS objects
        env:
          LFS_TOKEN: ${{ github.token }}
        run: |
          git lfs install --local
          # The helper reads LFS_TOKEN when Git invokes it.
          # shellcheck disable=SC2016
          git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo "password=${LFS_TOKEN}"; }; f' lfs pull --include="studio/**,public/**"

      - name: Check approved public asset provenance
        run: python3 scripts/check-public-assets.py

      - name: Check private exports and preparation jobs
        run: make check-library check-import check-studio check-studio-automation

  deployment:
    name: Build public site and deploy NUC
    needs: [frontend, backend, docker, studio]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEPLOY_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch approved public LFS exports
        env:
          LFS_TOKEN: ${{ github.token }}
        run: |
          git lfs install --local
          # The helper reads LFS_TOKEN when Git invokes it.
          # shellcheck disable=SC2016
          git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo "password=${LFS_TOKEN}"; }; f' lfs pull --include="public/**"
      - name: Reuse an already accepted frontend artifact
        id: artifact
        if: github.server_url == 'https://git.subcult.tv' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          deploy_dir=$(mktemp -d)
          trap 'rm -rf "$deploy_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$deploy_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_dir/known_hosts"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          ssh_args=(-F /dev/null -i "$deploy_dir/key" -o ControlPath=none -o ControlMaster=no -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$deploy_dir/known_hosts"
            -o ConnectTimeout=15 onnwee@10.0.0.56)
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "artifact $DEPLOY_REVISION subcult-tv-frontend" > "$deploy_dir/artifact.json"
          python3 - "$deploy_dir/artifact.json" "$GITHUB_OUTPUT" <<'PYCODE'
          import json, re, sys
          from pathlib import Path
          info = json.loads(Path(sys.argv[1]).read_text())
          available = info.get("available") is True
          if available:
              assert re.fullmatch(r"[0-9a-f]{64}", info.get("html_sha256", ""))
          with Path(sys.argv[2]).open("a") as output:
              output.write("available=" + str(available).lower() + "\n")
          PYCODE
      - name: Build deployable images from the verified revision
        if: steps.artifact.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          image="fleet-deploy/subcult-tv/subcult-tv-frontend:$DEPLOY_REVISION"
          docker build --build-arg VITE_API_URL= --label "org.opencontainers.image.revision=$DEPLOY_REVISION" \
            --label "org.opencontainers.image.source=https://git.subcult.tv/subculture-collective/subcult-tv" -t "$image" .
          bash scripts/check-public-image.sh "$image"
      - name: Deploy the built image and verify public HTML
        if: >-
          github.server_url == 'https://git.subcult.tv' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          REUSE_ARTIFACT: ${{ steps.artifact.outputs.available }}
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOMELAB_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          deploy_dir=$(mktemp -d)
          trap 'rm -rf "$deploy_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$deploy_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_dir/known_hosts"
          unset DEPLOY_KEY DEPLOY_KNOWN_HOSTS
          ssh_args=(-F /dev/null -i "$deploy_dir/key" -o ControlPath=none -o ControlMaster=no -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$deploy_dir/known_hosts"
            -o ConnectTimeout=15 onnwee@10.0.0.56)
          ssh "${ssh_args[@]}" status
          image="fleet-deploy/subcult-tv/subcult-tv-frontend:$DEPLOY_REVISION"
          # The forced receiver accepts a full hexadecimal revision; expand it here.
          if [[ "$REUSE_ARTIFACT" != true ]]; then
            # shellcheck disable=SC2029
            docker save "$image" | ssh "${ssh_args[@]}" "receive $DEPLOY_REVISION subcult-tv-frontend"
          fi
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "deploy $DEPLOY_REVISION"
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "artifact $DEPLOY_REVISION subcult-tv-frontend" > "$deploy_dir/artifact.json"
          expected=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["html_sha256"])' "$deploy_dir/artifact.json")
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            --max-time 30 https://subcult.tv/ > "$deploy_dir/live.html"
          actual=$(sha256sum "$deploy_dir/live.html" | cut -d' ' -f1)
          test "$actual" = "$expected"
          printf 'Live HTML matches the image built from %s\n' "$DEPLOY_REVISION"
